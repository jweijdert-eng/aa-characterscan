[build-system]
build-backend = "hatchling.build"
requires = [
    "hatchling",
]

[project]
name = "aa-characterscan"
description = "CharacterScan Plugin for Alliance Auth (GitHub Version)"
readme = "README.md"
keywords = [
    "allianceauth",
    "characterscan",
]
license = { file = "LICENSE" }
authors = [
    { name = "Peter Pfeufer", email = "develop@ppfeufer.de" },
]
requires-python = ">=3.10,<3.15"
classifiers = [
    "Environment :: Web Environment",
    "Framework :: Django",
    "Framework :: Django :: 5.2",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Internet :: WWW/HTTP :: Dynamic Content",
]
dynamic = [
    "version",
]
dependencies = [
    "allianceauth>=5",
    "django-esi>=8",           # Token + token_required (recruit- en standings-tokens)
    "django-eveuniverse>=2",   # skill→groep-resolutie (los van Member Audit)
    "aa-charlink>=1.12",       # koppel-flow voor recruit- en standings-tokens
]
urls.Changelog = "https://github.com/ppfeufer/aa-characterscan/blob/master/CHANGELOG.md"
urls.Tracker = "https://github.com/ppfeufer/aa-characterscan/issues"

[tool.hatch]
version.path = "characterscan/__init__.py"
build.include = [
    "/characterscan",
]
